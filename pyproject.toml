[project]
name = "agenty"
version = "0.1.0"
description = "A demo agent CLI built with uv"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "questionary>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
agenty = "agenty.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
