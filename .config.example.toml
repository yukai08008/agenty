# Agenty Configuration
# Copy this file to ~/.config/agenty/config.toml and fill in your values.
#
#   mkdir -p ~/.config/agenty
#   cp .config.example.toml ~/.config/agenty/config.toml

[llm]
# Your LLM API key (required for chat/run commands)
api_key = ""

# API base URL (optional, for custom endpoints)
# base_url = "https://api.openai.com/v1"

# Model name (optional)
# model = "gpt-4o"

[agent]
# Default behavior settings
# language = "en"
# max_tokens = 4096
