milestone: M1-Anna
version: v0.01
parent_final: null
bootstrap_base: "9876fda"
title: Runtime 接入基线
type: api
prd: dev_plans/v0.00-v0.01/PRD.md
test_cases: dev_plans/v0.00-v0.01/TEST_CASES.md

invariants:
  - "RuntimeMachine 与 AgentyMachine 只通过命令和事件协作"
  - "公共模型不包含 OpenCode 专属参数"
  - "跨边界和可持久化状态数据使用 Pydantic v2"
  - "默认不启用自动批准"
  - "自动测试不调用真实模型"
  - "运行时数据不在 git 追踪中"

deliverables:
  - module: src/agenty/runtime/protocol.py
    change: 定义 Runtime 公共状态、事件外壳、标识和聚合快照
    public_api:
      - AvailabilityState / ChannelState / SessionState / TurnState
      - AvailabilityEvent / ChannelEvent / SessionEvent / TurnEvent / OutputEvent
      - RuntimeIdentity / RuntimeEvent / RuntimeSnapshot
  - module: tests/test_runtime_protocol.py
    change: v0.01-a 公共协议合同测试
  - module: src/agenty/runtime/availability.py
    change: 由标准 Availability 事件驱动的纯状态机
    public_api:
      - AvailabilityMachine / InvalidAvailabilityTransition
  - module: src/agenty/runtime/protocol.py
    change: 增加带作用域、证据和约束的 CapabilityRecord
    public_api:
      - CapabilityRecord / CapabilitySupport / EvidenceLevel
  - module: tests/test_availability_machine.py
    change: v0.01-b Capability 与 Availability 状态合同测试
  - module: src/agenty/runtime/machine.py
    change: 编排公共 Availability 事件的通用无副作用 Probe
    public_api:
      - RuntimeProbeMachine
  - module: src/agenty/runtime/opencode.py
    change: 与 OpenCode 1.18.26 绑定的发现和 help 能力适配
    public_api:
      - OpenCodeRuntimeAdapter
  - module: tests/test_opencode_probe.py
    change: v0.01-c 版本、失败分类、证据边界和无模型调用测试

feature_branches:
  - name: v0.01-a
    title: Runtime 公共协议
    deps: []
    acceptance:
      - "PA-1 四个子状态机拥有相互独立的状态类型"
      - "PA-2 标准事件能够携带 Runtime、关联、Session 和 Turn 上下文"
      - "PA-3 RuntimeSnapshot 不把四类状态压成一个组合枚举"
      - "PA-4 公共协议不存在 Runtime 厂商专属字段"
  - name: v0.01-b
    title: Capability 与 AvailabilityMachine
    deps: [v0.01-a]
    acceptance:
      - "PB-1 Availability 状态与已确认协议一致"
      - "PB-2 Capability 绑定版本、通道、证据和约束"
      - "PB-3 Runtime 协议与 AvailabilityStateData 可校验并 JSON 往返恢复"
  - name: v0.01-c
    title: OpenCode 1.18.26 Probe
    deps: [v0.01-b]
    acceptance:
      - "PC-1 probe 不调用模型即可报告版本和带证据能力"
      - "PC-2 缺失、异常或不兼容 OpenCode 进入明确状态"
      - "PC-3 输出足以供未来 AgentyMachine 决策的 RuntimeSnapshot"

acceptance_count: 10

risk_register:
  - id: R1
    risk: 公共协议被 OpenCode 专属概念污染
    mitigation: 厂商字段合同测试
    severity: high
  - id: R2
    risk: 过早把未确认的过渡状态固化进协议
    mitigation: v0.01-a 明确排除 CANCELLING 和 DELETING
    severity: medium
  - id: R3
    risk: Probe 把帮助参数误报为已经验证的能力
    mitigation: v0.01-c 统一迁移到 CapabilityRecord，help 记录保持 unknown/advertised
    severity: medium
  - id: R4
    risk: 状态数据使用 dataclass 导致跨边界校验和持久化合同不一致
    mitigation: 对齐 andybot，统一使用 Pydantic v2 BaseModel
    severity: high

git_workflow:
  branch_creation: v0.01-a continues from pre-split feature baseline 8784a82
  feature_order: v0.01-a, v0.01-b, v0.01-c
  merge_policy: --no-ff
  before_merge_checks:
    - "pytest all PASS"
    - "合同测试 PASS"
    - "git ls-files data/ | wc -l == 0"
  final_tag: null

签名: Agent-PM-v0.01
