milestone: M1-Anna
version: v0.05
parent_final: null
parent_baseline: "v0.03@a035a0e"
title: RuntimeMachine 应用侧完整职责
type: api
prd: dev_plans/v0.03-v0.05/PRD.md
test_cases: dev_plans/v0.03-v0.05/TEST_CASES.md

invariants:
  - "Runtime 类型与版本共同确定 Adapter"
  - "应用不依赖厂商事件结构"
  - "Session 接续必须校验 Environment identity"
  - "auto 默认关闭且授权决策可审计"
  - "跨边界和可持久化状态使用 Pydantic v2"
  - "默认测试不调用真实模型"
  - "运行时数据不在 git 追踪中"

deliverables:
  - module: docs/runtime-machine-application-contract.md
    change: 六类应用侧职责和逐类状态机实施顺序
  - module: src/agenty/runtime/protocol.py
    change: 应用选择的 RuntimeTarget 精确类型与版本模型
    public_api:
      - RuntimeTarget
  - module: src/agenty/runtime/selection.py
    change: 精确版本 Adapter 注册表和 Runtime 选择状态机
    public_api:
      - RuntimeAdapterRegistry
      - RuntimeSelectionMachine
      - RuntimeSelectionStateData
  - module: tests/test_runtime_selection.py
    change: v0.05-a Runtime 类型与版本回归
  - module: src/agenty/runtime/events.py
    change: 连续 sequence、上下文锁定和 raw 诊断隔离的公共事件流状态机
    public_api:
      - RuntimeEventStreamMachine
      - RuntimeEventStreamStateData
      - RuntimeRawEventRecord
  - module: src/agenty/runtime/opencode_events.py
    change: OpenCode 1.18.26 JSON 事件归一化
    public_api:
      - OpenCodeEventNormalizer
  - module: tests/test_runtime_events.py
    change: EV 公共事件顺序、上下文和持久化回归
  - module: tests/test_opencode_events.py
    change: OpenCode 已知、未知和畸形事件归一化回归
  - module: src/agenty/runtime/session.py
    change: Session 新建、接续、生命周期和 EnvironmentBinding 状态机
    public_api:
      - SessionMachine
      - RuntimeSessionCoordinator
      - RuntimeSessionBindingCatalog
  - module: src/agenty/runtime/protocol.py
    change: ProjectEnvironment、Session 请求与不可变 Binding 公共模型
    public_api:
      - ProjectEnvironment
      - RuntimeSessionRequest
      - RuntimeSessionBinding
  - module: tests/test_session_machine.py
    change: v0.05-c Session 与 Environment 绑定回归
  - module: src/agenty/runtime/model_selection.py
    change: desired/effective 分离的模型与 effort 选择状态机
    public_api:
      - RuntimeModelSelectionMachine
      - ModelSelectionStateData
  - module: src/agenty/runtime/opencode_models.py
    change: OpenCode 1.18.26 verbose 模型目录解析
    public_api:
      - OpenCodeModelCatalogParser
  - module: src/agenty/runtime/protocol.py
    change: 模型引用、选择、描述、目录和 binding 公共模型
    public_api:
      - RuntimeModelRef
      - RuntimeModelSelection
      - RuntimeModelDescriptor
      - RuntimeModelCatalog
      - RuntimeModelBinding
  - module: tests/test_model_selection.py
    change: v0.05-d 模型与 effort 状态机回归
  - module: tests/test_opencode_models.py
    change: OpenCode 模型目录解析与 Adapter 回归
  - module: src/agenty/runtime/interaction.py
    change: 交互策略能力守卫、审批暂停/恢复和审计状态机
    public_api:
      - RuntimeInteractionMachine
      - InteractionStateData
  - module: src/agenty/runtime/protocol.py
    change: 交互策略、审批请求/决策和审计事件公共模型
    public_api:
      - RuntimeInteractionPolicy
      - RuntimeApprovalRequest
      - RuntimeApprovalDecision
  - module: tests/test_runtime_interaction.py
    change: v0.05-e 默认拒绝、ask、auto、审计和恢复回归
  - module: src/agenty/runtime/results.py
    change: 终态结果聚合、失败分类、usage、文件系统变化观察和事件证据输出
    public_api:
      - RuntimeResultCollector
      - WorkspaceSnapshot
      - classify_failure
      - aggregate_usage
  - module: src/agenty/runtime/protocol.py
    change: 不可变 usage、artifact manifest、事件日志引用和 TurnResult 公共模型
    public_api:
      - RuntimeUsage
      - RuntimeArtifact
      - ArtifactManifest
      - EventLogRef
      - TurnResult
  - module: tests/test_runtime_results.py
    change: v0.05-f 失败、usage、artifact、日志与 JSON 恢复回归
  - module: AGENTS.md
    change: 仓库级接手顺序、架构不变量、当前进度、下一阶段和质量门
  - module: ROADMAP.md
    change: 产品目标、M1 Anna 完成定义、版本路线和当前差距
  - module: CHANGELOG.md
    change: 按版本和功能分支记录行为变化、验证证据与限制

feature_branches:
  - name: v0.05-a
    title: Runtime 类型与版本选择
    deps: []
    acceptance:
      - "RA-1 应用用类型和精确版本选择 Runtime"
      - "RA-2 注册表只返回精确匹配的 Adapter"
      - "RA-3 探测身份与目标不一致时拒绝选择"
      - "RA-4 选择状态可序列化、恢复和重试"
  - name: v0.05-b
    title: 事件归一化
    deps: [v0.05-a]
    acceptance:
      - "EV-1 厂商事件转换为有序公共事件"
      - "EV-2 公共事件保留完整关联上下文"
      - "EV-3 未知与畸形事件不能静默改变状态"
  - name: v0.05-c
    title: 会话管理
    deps: [v0.05-b]
    acceptance:
      - "SE-1 支持新建和接续两种公共命令"
      - "SE-2 Session 与 Environment identity 共同绑定"
      - "SE-3 Environment 不匹配时阻断接续"
  - name: v0.05-d
    title: 模型与 effort
    deps: [v0.05-c]
    acceptance:
      - "MO-1 模型类型、标识和 effort 使用中立模型"
      - "MO-2 desired 与 effective 配置分离"
      - "MO-3 不支持的选择在执行前失败"
  - name: v0.05-e
    title: 交互管理
    deps: [v0.05-d]
    acceptance:
      - "IN-1 ask、auto 和 deny 策略明确"
      - "IN-2 中途授权可暂停和恢复 Turn"
      - "IN-3 自动及人工决策均写入审计事件"
  - name: v0.05-f
    title: 监控与结果
    deps: [v0.05-e]
    acceptance:
      - "RS-1 额度、限流、认证、模型、超时和崩溃分类"
      - "RS-2 TurnResult 聚合输出、usage 和 failure"
      - "RS-3 ArtifactManifest 与 EventLogRef 可追踪"

acceptance_count: 19

risk_register:
  - id: R1
    risk: 状态组合爆炸
    mitigation: 六类独立状态数据并由门面聚合
    severity: high
  - id: R2
    risk: 厂商字段污染应用合同
    mitigation: 公共字段和事件归一化回归
    severity: high
  - id: R3
    risk: Session 与 Environment 错配
    mitigation: 接续前强制双重校验
    severity: high
  - id: R4
    risk: auto 无意扩大权限
    mitigation: 默认关闭并审计每次决策
    severity: high

git_workflow:
  branch_creation: from v0.03-c@a035a0e because v0.03 is an unreleased API baseline
  feature_order: v0.05-a, v0.05-b, v0.05-c, v0.05-d, v0.05-e, v0.05-f
  merge_policy: --no-ff
  before_merge_checks:
    - "pytest all PASS"
    - "六类职责累计合同测试 PASS"
    - "git ls-files data/ | wc -l == 0"
  final_tag: null

签名: Agent-PM-v0.05
